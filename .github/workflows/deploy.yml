name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Déclenche l'action lors d'un push sur la branche main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests with pytest
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest app/test_api.py

  deploy:
    runs-on: ubuntu-latest
    needs: test  # Assure que les tests sont validés avant de déployer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Connect to AWS EC2 and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            echo "🚀 Début du déploiement sur AWS EC2"

            # 🟢 Vérifier et installer Docker si nécessaire
            echo "🔍 Vérification de Docker..."
            if ! command -v docker &> /dev/null
            then
              echo "⚠️ Docker non trouvé, installation en cours..."
              sudo apt update
              sudo apt install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
            else
              echo "✅ Docker est déjà installé"
            fi

            # 🔐 Connexion à Docker Hub et mise à jour de l'image
            echo "🔐 Connexion à Docker Hub..."
            docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

            echo "🗑️ Suppression de l'ancienne image Docker..."
            docker rmi nathalie77/projet7-api:latest || true

            echo "📥 Téléchargement de la dernière image..."
            docker pull nathalie77/projet7-api:latest

            # 🚀 Supprimer les anciens conteneurs proprement
            echo "🗑️ Suppression des anciens conteneurs..."
            docker stop projet7-api || true
            docker rm projet7-api || true
            docker ps -q --filter "publish=8000" | xargs -r docker stop
            docker ps -q --filter "publish=8000" | xargs -r docker rm

            # 🚀 Lancer le conteneur avec FastAPI et Streamlit
            echo "⏳ Attente du démarrage de l'API (max 30s)..."
            for i in {1..6}; do
              sleep 5
              if curl -s http://localhost:8000/ > /dev/null; then
                echo "✅ L'API est accessible !"
                break
              fi
              echo "⏳ Tentative $i/6 : l'API ne répond pas encore..."
              if [ $i -eq 6 ]; then
                echo "❌ L'API ne répond toujours pas après 30 secondes. Échec."
                exit 1
              fi
            done
